# Properties may be overridden in this optional properties file.
spring.config.import=optional:classpath:env.properties
spring.application.name=avenirs-portfolio-statistics
spring.profiles.active=prod
server.port=10030
# suppress inspection "SpellCheckingInspection"
server.tomcat.additional-tld-skip-patterns=org.apache.tomcat.util.compat.Jre22Compat
# Swagger
springdoc.api-docs.path=/avenirs-portfolio-statistics/api-docs
springdoc.swagger-ui.path=/avenirs-portfolio-statistics/swagger-ui
# Security
security.permit-all-paths=/actuator/prometheus,/actuator/health,/avenirs-portfolio-statistics/api-docs/**,/avenirs-portfolio-statistics/swagger-ui/**,/favicon.ico,/actuator/health
# Persistence
spring.datasource.url=jdbc:postgresql://localhost:65432/avenirs_statistics
spring.datasource.username=avenirs_statistics_admin
# suppress inspection "SpellCheckingInspection"
spring.datasource.password=ENC(RU/oKTdrWITCnPCQmoYT5KdHtuOB6Bf6aF7owLL2d5QZukCEUpihkA==)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=dev
# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=false
spring.liquibase.default_schema=dev
spring.liquibase.parameters.avenirs.admin.role=avenirs_statistics_admin_role
# Events are written by the other micro-services (api key) and read through APISIX (hmac).
security.authentication.filter=api-key-or-hmac
security.authentication.api-key=ENC(tfNG7vGZMGuUCwfLTfcuIcRY6zp5yg3sHsUrG+3Ys7uEOGE+swRhezj4/jmWJzg4dmoGxH6RhMQ=)
# Jasypt
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator
jasypt.encryptor.password=${jasypt-encryptor-password}
# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=false
# Logging
logging.level.org.apache.http.wire=error
logging.level.liquibase=error
logging.level.org.hibernate.sql=error
logging.level.org.hibernate.type.descriptor.sql.basic-binder=error
logging.level.com.github.ulisesbocchio.jasypt=error
logging.file.name=logs/avenirs-portfolio-statistics.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.max-size=10MB
logging.file.max-history=30
# Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
# Seeder
seeder.enabled=false
seeder.source=CSV
seeder.dependencies-check=false
seeder.schema=dev
